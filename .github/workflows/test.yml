name: tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q jq ffmpeg tesseract-ocr poppler-utils shellcheck
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install jq ffmpeg tesseract poppler shellcheck
      - name: make
        run: make
